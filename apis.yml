aid: novartis
name: Novartis
description: >-
  Novartis AG is a Swiss multinational pharmaceutical corporation
  headquartered in Basel, Switzerland, and one of the largest pharmaceutical
  companies in the world by revenue. The company focuses on innovative
  medicines across oncology, immunology, neuroscience, cardiovascular,
  renal, and metabolic disease areas. Novartis does not publish a public
  external developer API. The company does maintain an Open Source Science
  programme that releases scientific computing libraries, Drupal modules,
  and informatics tooling on GitHub for use by the research community.
